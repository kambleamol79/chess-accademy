<div class="ms-auto">
  <ul class="list-unstyled header-actions">
    @if (isStudent() && tournamentCta(); as cta) {
      <li class="header-actions__cta">
        <a
          class="btn btn-sm student-tournament-cta student-tournament-cta--highlight"
          [href]="cta.url"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="student-tournament-cta__badge">Live</span>
          <i class="ti ti-tournament"></i>
          <span>{{ cta.label }}</span>
        </a>
      </li>
    }
    <li>
      <div class="dropdown pc-h-item header-user-profile" ngbDropdown>
        <a class="pc-head-link head-link-primary dropdown-toggle arrow-none me-0" href="javascript:" ngbDropdownToggle>
          <i class="ti ti-user f-20"></i>
        </a>
        <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
          <div class="dropdown-header px-3 py-3">
            @if (auth.user(); as u) {
              <h5 class="mb-1">{{ u.first_name }} {{ u.last_name }}</h5>
              <p class="text-muted mb-0 text-capitalize">{{ u.role }}</p>
              <small class="text-muted">{{ u.email }}</small>
            }
          </div>
          <div class="dropdown-divider"></div>
          @if (canEditProfile()) {
            <a href="javascript:" class="dropdown-item" (click)="openProfile()">
              <i class="ti ti-user-edit"></i>
              <span>Edit profile</span>
            </a>
          }
          <a href="javascript:" class="dropdown-item" (click)="logout()">
            <i class="ti ti-logout"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </li>
  </ul>
</div>
