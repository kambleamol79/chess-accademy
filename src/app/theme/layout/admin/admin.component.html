<app-navigation
  class="coded-navbar pc-sidebar"
  [ngClass]="{
    'navbar-collapsed': navCollapsed,
    horizontal: currentLayout === 'horizontal',
    compact: currentLayout === 'compact',
    'mob-open': navCollapsedMob,
    'student-portal-nav': isStudent()
  }"
  (NavCollapsedMob)="navMobClick()"
/>
<app-nav-bar
  [class.student-portal-header]="isStudent()"
  (NavCollapse)="this.navCollapsed = !this.navCollapsed"
  (NavCollapsedMob)="navMobClick()"
/>
<div class="pc-container" [class.student-portal-main]="isStudent()">
  <div class="coded-wrapper">
    <div class="coded-content">
      <div class="coded-inner-content">
        @if (!isStudent()) {
          <app-breadcrumb />
        }
        <div class="main-body">
          <div class="page-wrapper" [class.student-portal-page]="isStudent()">
            <router-outlet />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pc-menu-overlay" (click)="closeMenu()" (keydown)="handleKeyDown($event)" tabindex="0"></div>
</div>
@if (!isStudent()) {
  <footer class="pc-footer">
    <div class="footer-wrapper container-fluid">
      <div class="row">
        <div class="col my-1">
          <p class="m-0">
            Copyright &copy;
            <a href="https://codedthemes.com" target="_blank">CodedThemes</a>
          </p>
        </div>
      </div>
    </div>
  </footer>
  <app-configuration />
}
