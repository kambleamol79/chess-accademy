<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card mt-5">
        <div class="card-body">
          <form (ngSubmit)="onSubmit($event)">
            <div class="d-flex justify-content-center">
              <h3 class="text-secondary mb-0"><b>{{ appName }}</b></h3>
            </div>
            <div class="auth-header text-center mt-4 mb-3">
              <h2 class="text-secondary"><b>Student registration</b></h2>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" placeholder="First name" [field]="registerForm.first_name" />
                  <label>First name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" placeholder="Last name" [field]="registerForm.last_name" />
                  <label>Last name</label>
                </div>
              </div>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" placeholder="Email" [field]="registerForm.email" />
              <label>Email</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control" placeholder="Password" [field]="registerForm.password" />
              <label>Password (min 8)</label>
            </div>
            @if (error()) {
              <div class="alert alert-danger">{{ error() }}</div>
            }
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="loading()">
                {{ loading() ? 'Creating account…' : 'Register' }}
              </button>
            </div>
            <hr />
            <p class="text-center mb-0">
              <a [routerLink]="['/login']">Already have an account? Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
