<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <form (ngSubmit)="onSubmit($event)">
            <div class="d-flex justify-content-center">
              <h3 class="text-secondary mb-0"><b>{{ appName }}</b></h3>
            </div>
            <div class="row">
              <div class="d-flex justify-content-center">
                <div class="auth-header">
                  <h2 class="text-secondary mt-4"><b>Welcome back</b></h2>
                  <p class="fs-5 mt-2">Sign in to continue</p>
                </div>
              </div>
            </div>
            <div class="form-floating mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                [(ngModel)]="email"
                required
                placeholder="Email"
              />
              <label for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                [(ngModel)]="password"
                required
                minlength="8"
                placeholder="Password"
              />
              <label for="password">Password</label>
            </div>
            @if (error()) {
              <div class="alert alert-danger" role="alert">{{ error() }}</div>
            }
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-secondary" [disabled]="loading()">
                {{ loading() ? 'Signing in…' : 'Sign In' }}
              </button>
            </div>
            <hr />
            <h5 class="d-flex justify-content-center">
              <a [routerLink]="['/register']">Create student account</a>
            </h5>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
