<div class="modal-header">
  <h5 class="modal-title">Edit invoice #{{ invoiceId }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>

<div class="modal-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="amount">Amount (₹)</label>
      <input id="amount" type="number" class="form-control" [(ngModel)]="amount" name="amount" min="0" step="0.01" />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="dueDate">Due date</label>
      <input id="dueDate" type="date" class="form-control" [(ngModel)]="due_date" name="due_date" />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="status">Status</label>
      <select id="status" class="form-select" [(ngModel)]="status" name="status">
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label" for="description">Description</label>
      <textarea id="description" class="form-control" rows="2" [(ngModel)]="description" name="description"></textarea>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger mt-3 mb-0">{{ error() }}</div>
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="dismiss()" [disabled]="saving()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Saving…' : 'Save changes' }}
  </button>
</div>
