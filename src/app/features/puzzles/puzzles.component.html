<app-card cardTitle="Puzzles">
  @if (loading()) {
    <p class="text-muted">Loading…</p>
  } @else if (error()) {
    <div class="alert alert-warning">{{ error() }}</div>
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Difficulty</th>
          <th>FEN</th>
        </tr>
      </thead>
      <tbody>
        @for (p of rows(); track p['id']) {
          <tr>
            <td>{{ p['title'] || 'Puzzle #' + p['id'] }}</td>
            <td>{{ p['difficulty'] }}</td>
            <td><code class="small">{{ p['fen'] }}</code></td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-muted">No puzzles yet. Add via API or admin tools.</td>
          </tr>
        }
      </tbody>
    </table>
  }
</app-card>
