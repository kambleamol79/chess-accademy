<div class="modal-header">
  <h5 class="modal-title">{{ isEdit ? 'Edit coach' : 'Add coach' }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>

<div class="modal-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="firstName">First name</label>
      <input id="firstName" class="form-control" [(ngModel)]="first_name" name="first_name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="lastName">Last name</label>
      <input id="lastName" class="form-control" [(ngModel)]="last_name" name="last_name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="email">Email (login)</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" [required]="!isEdit" />
    </div>
    @if (!isEdit || canSetPassword()) {
      <div class="col-md-6">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          minlength="8"
          [required]="!isEdit"
          placeholder="{{ isEdit ? 'Leave blank to keep current password' : '' }}"
        />
        <div class="form-text">
          {{ isEdit ? 'Optional (min 8 chars if provided)' : 'Minimum 8 characters' }}
        </div>
      </div>
    }
    <div class="col-md-6">
      <label class="form-label" for="phone">Phone</label>
      <input id="phone" class="form-control" [(ngModel)]="phone" name="phone" />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="title">Title</label>
      <input id="title" class="form-control" [(ngModel)]="title" name="title" placeholder="e.g. FIDE Instructor" />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="rating">FIDE / coach rating</label>
      <input id="rating" type="number" class="form-control" [(ngModel)]="rating" name="rating" min="0" />
    </div>
    <div class="col-12">
      <label class="form-label" for="bio">Bio</label>
      <textarea id="bio" class="form-control" rows="3" [(ngModel)]="bio" name="bio"></textarea>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger mt-3 mb-0">{{ error() }}</div>
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="dismiss()" [disabled]="saving()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Saving…' : isEdit ? 'Save changes' : 'Add coach' }}
  </button>
</div>
