<app-card cardTitle="Coaches">
  @if (loading()) {
    <p class="text-muted">Loading…</p>
  } @else if (error()) {
    <div class="alert alert-warning">{{ error() }}</div>
  } @else {
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Title</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody>
        @for (c of rows(); track c['id']) {
          <tr>
            <td>{{ c['first_name'] }} {{ c['last_name'] }}</td>
            <td>{{ c['email'] }}</td>
            <td>{{ c['title'] || '—' }}</td>
            <td>{{ c['rating'] ?? '—' }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-muted">No coaches yet</td>
          </tr>
        }
      </tbody>
    </table>
  }
</app-card>
