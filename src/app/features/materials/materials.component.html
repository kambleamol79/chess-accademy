<app-card cardTitle="Class materials">
  @if (loading()) {
    <p class="text-muted">Loading…</p>
  } @else if (error()) {
    <div class="alert alert-warning">{{ error() }}</div>
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Batch</th>
          <th>Title</th>
          <th>Type</th>
          <th>Link</th>
          @if (canDelete()) {
            <th class="text-end">Actions</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (m of rows(); track m['id']) {
          <tr>
            <td>{{ m['batch'] }}</td>
            <td>{{ m['title'] }}</td>
            <td>{{ m['type'] }}</td>
            <td>
              <a [href]="m['url']" target="_blank" rel="noopener">Open</a>
            </td>
            @if (canDelete()) {
              <td class="text-end">
                <button
                  type="button"
                  class="btn btn-outline-danger btn-sm"
                  title="Delete"
                  [disabled]="deletingId() === m['id']"
                  (click)="deleteMaterial(m)"
                >
                  <i class="ti ti-trash"></i>
                </button>
              </td>
            }
          </tr>
        } @empty {
          <tr>
            <td [attr.colspan]="canDelete() ? 5 : 4" class="text-muted">No materials uploaded</td>
          </tr>
        }
      </tbody>
    </table>
  }
</app-card>
