<app-card cardTitle="Class materials">
  @if (loading()) {
    <p class="text-muted">Loading…</p>
  } @else if (error()) {
    <div class="alert alert-warning">{{ error() }}</div>
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Batch</th>
          <th>Title</th>
          <th>Type</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        @for (m of rows(); track m['id']) {
          <tr>
            <td>{{ m['batch'] }}</td>
            <td>{{ m['title'] }}</td>
            <td>{{ m['type'] }}</td>
            <td>
              <a [href]="m['url']" target="_blank" rel="noopener">Open</a>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-muted">No materials uploaded</td>
          </tr>
        }
      </tbody>
    </table>
  }
</app-card>
