<div class="modal-header">
  <h5 class="modal-title">Change password</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>

<div class="modal-body">
  <p class="mb-3">
    Set a new password for <strong>{{ staffLabel() }}</strong>
    <span class="text-muted">({{ staff.email }})</span>
  </p>

  <div class="mb-3">
    <label class="form-label" for="staffNewPassword">New password</label>
    <input
      id="staffNewPassword"
      type="password"
      class="form-control"
      [(ngModel)]="password"
      name="password"
      minlength="8"
      autocomplete="new-password"
    />
  </div>
  <div class="mb-0">
    <label class="form-label" for="staffConfirmPassword">Confirm password</label>
    <input
      id="staffConfirmPassword"
      type="password"
      class="form-control"
      [(ngModel)]="passwordConfirm"
      name="passwordConfirm"
      minlength="8"
      autocomplete="new-password"
    />
    <div class="form-text">Minimum 8 characters. They will need to sign in again on other devices.</div>
  </div>

  @if (error()) {
    <div class="alert alert-danger mt-3 mb-0">{{ error() }}</div>
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="dismiss()" [disabled]="saving()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Saving…' : 'Update password' }}
  </button>
</div>
