<app-card cardTitle="Game review">
  @if (loading()) {
    <p class="text-muted">Loading…</p>
  } @else if (error()) {
    <div class="alert alert-warning">{{ error() }}</div>
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Title</th>
          <th>Reviewed</th>
        </tr>
      </thead>
      <tbody>
        @for (g of rows(); track g['id']) {
          <tr>
            <td>{{ g['first_name'] }} {{ g['last_name'] }}</td>
            <td>{{ g['title'] || 'Game #' + g['id'] }}</td>
            <td>{{ g['reviewed_at'] || 'Pending' }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-muted">No games submitted yet</td>
          </tr>
        }
      </tbody>
    </table>
  }
</app-card>
