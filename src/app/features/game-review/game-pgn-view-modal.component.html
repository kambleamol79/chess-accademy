<div class="modal-header">
  <h5 class="modal-title">{{ game.title || 'Game #' + game.id }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>

<div class="modal-body">
  @if (parseError()) {
    <div class="alert alert-danger">{{ parseError() }}</div>
  } @else {
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <span class="small fw-semibold">{{ caption() }}</span>
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-primary" [disabled]="!canPrevious()" (click)="previous()">
          Previous
        </button>
        <button type="button" class="btn btn-outline-primary" [disabled]="!canNext()" (click)="next()">
          Next
        </button>
      </div>
    </div>
    <app-chess-board [fen]="fen()" [flipped]="false" [disabled]="true" />
    @if (moveSans().length > 0) {
      <div class="mt-3 small text-muted">
        {{ moveSans().length }} moves in this game
      </div>
    }
  }
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="dismiss()">Close</button>
</div>
