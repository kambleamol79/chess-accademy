name: student_app
description: Brainstorm Chess Academy — student mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  chess: ^0.8.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  stockfish: ^1.8.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
